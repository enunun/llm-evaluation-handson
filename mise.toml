[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"

[env]
PROMPTFOO_DISABLE_TELEMETRY = "1"
PROMPTFOO_DISABLE_UPDATE = "1"
OLLAMA_HOST = "{{ get_env(name='OLLAMA_HOST', default='http://localhost:11434') }}"

[tasks.install]
description = "依存パッケージを入れ，iterations/*/*をワークスペースに登録する"
run = "pnpm install"

[tasks.fmt]
description = "コードと設定ファイルをoxfmtで整形する"
depends = ["install"]
run = "pnpm fmt"

[tasks.lint]
description = "oxlint，oxfmtの検査，textlint，markdownlint，Mermaidの構文検査，設計とコードの照合を実行する"
depends = ["install"]
run = "pnpm lint"

[tasks.typecheck]
description = "すべてのパッケージを型検査する"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "すべてのパッケージの単体テストと統合テストを実行する"
depends = ["install"]
run = "pnpm test"

[tasks.check]
description = "リント，型検査，テストをまとめて実行する(リポジトリ全体の検証)"
depends = ["lint", "typecheck", "test"]

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフック)"
depends = ["install", "hooks"]

[tasks."ollama:pull"]
description = "製品とJudge用のモデル(qwen2.5:3b)と意思決定モデル(tev1)をOllamaに取得する"
run = """
for model in qwen2.5:3b tev1; do
  echo "pulling $model"
  curl -sSf "$OLLAMA_HOST/api/pull" -d "{\\"model\\": \\"$model\\", \\"stream\\": false}"
  echo
done
"""

[tasks."ollama:status"]
description = "Ollamaに接続できるかと，取得済みのモデルを表示する"
run = "curl -sSf \"$OLLAMA_HOST/api/version\" && echo && curl -sSf \"$OLLAMA_HOST/api/tags\" | jq -r '.models[].name'"

[tasks."promptfoo:view"]
description = "promptfooの結果をブラウザで表示する(ポート15500)"
run = "pnpm exec promptfoo view --yes"
