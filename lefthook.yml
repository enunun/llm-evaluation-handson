# コミット時に，ステージしたファイルを検査する．
# CIは，同じ設定のツールをリポジトリ全体に対して実行する(mise run check)．
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase

  commands:
    oxfmt:
      glob: "*.{ts,mjs,js,json,yaml,yml}"
      run: pnpm oxfmt --check {staged_files}

    oxlint:
      glob: "*.{ts,mjs,js}"
      run: pnpm oxlint --type-aware --deny-warnings {staged_files}

    textlint:
      glob: "*.md"
      run: pnpm textlint {staged_files}

    markdownlint:
      glob: "*.md"
      run: pnpm markdownlint-cli2 {staged_files}
